appId: id.scnias.app.debug
name: "Login - Password salah menampilkan error"
---
- launchApp:
    clearState: true

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    text: "email@contoh.com"
- inputText: "admin@studycenter.com"

- tapOn:
    text: "••••••••"
- inputText: "wrongpassword123"

- tapOn:
    text: "Masuk"

- waitForAnimationToEnd:
    timeout: 8000

# Harus tetap di login (ada teks "Selamat datang" atau pesan error)
- assertNotVisible: "ADMINISTRATOR"
